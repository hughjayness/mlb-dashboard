<script>
var currentGames = [];
var filteredGames = [];
var TRACKER_STORAGE_KEY = "bobby_mlb_tracker_archive_v2";

function setStatus(text){ document.getElementById("statusBox").textContent = text; }

function pillClass(label){
  if (label === "High") return "pill good";
  if (label === "Medium") return "pill warn";
  return "pill bad";
}

function formatPct(v){
  return v === null || v === undefined || v === "" ? "—" : String(v) + "%";
}

function formatOdds(v){
  return v == null || v === "" ? "" : (Number(v) > 0 ? "+" + Number(v) : String(v));
}

function shortSideConf(game){
  return game.away + " " + formatPct(game.moneylineConfidence?.away) + " / " +
         game.home + " " + formatPct(game.moneylineConfidence?.home);
}

function shortTotalConf(game){
  return "Over " + formatPct(game.totalConfidence?.over) + " / Under " + formatPct(game.totalConfidence?.under);
}

function shortRunLineConf(game){
  return game.away + " " + formatPct(game.runLineConfidence?.away) + " / " +
         game.home + " " + formatPct(game.runLineConfidence?.home);
}

function factorValue(obj, path, fallback) {
  try {
    var parts = path.split(".");
    var cur = obj;
    for (var i = 0; i < parts.length; i++) cur = cur[parts[i]];
    return cur === null || cur === undefined || cur === "" ? fallback : cur;
  } catch (e) {
    return fallback;
  }
}

function extractTotalLine(totalText){
  var m = String(totalText || "").match(/O\/U\s+([0-9.]+)/i);
  return m ? m[1] : "";
}

function getTrackedPicks() {
  try {
    var raw = localStorage.getItem(TRACKER_STORAGE_KEY);
    var arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  } catch (e) {
    return [];
  }
}

function setTrackedPicks(arr) {
  localStorage.setItem(TRACKER_STORAGE_KEY, JSON.stringify(arr));
}

function archiveIdForGame(game) {
  return [
    game.eventId || "",
    game.rawCommenceTime || "",
    game.bestBet || "",
    game.bestBetType || ""
  ].join("|");
}

function archiveHighConfidencePicks(games) {
  if (!Array.isArray(games) || !games.length) return 0;

  var existing = getTrackedPicks();
  var map = {};

  existing.forEach(function(p) {
    var key = p.archiveId || [
      p.eventId || "",
      p.rawCommenceTime || "",
      p.bestBet || "",
      p.bestBetType || ""
    ].join("|");
    map[key] = p;
  });

  var added = 0;

  games.forEach(function(game) {
    if (!game) return;
    if ((game.confidence || "") !== "High") return;
    if (!game.bestBet || game.bestBet === "Pass") return;

    var record = {
      archiveId: archiveIdForGame(game),
      archivedAt: new Date().toISOString(),
      source: "Auto-archived from index",
      eventId: game.eventId || "",
      rawCommenceTime: game.rawCommenceTime || "",
      away: game.away || "",
      home: game.home || "",
      matchup: (game.away || "") + " @ " + (game.home || ""),
      bestBet: game.bestBet || "",
      bestBetType: game.bestBetType || "",
      confidence: game.confidence || "Low",
      oddsPrice: game.bestBetOdds != null ? game.bestBetOdds : null,
      moneyline: game.moneyline || "",
      total: game.total || "",
      runLine: game.runLine || "",
      resultStatus: "Pending",
      resultDetail: "",
      grade: "",
      netUnits: null,
      profitDollars: null
    };

    if (!map[record.archiveId]) {
      map[record.archiveId] = record;
      added += 1;
    } else {
      map[record.archiveId] = Object.assign({}, map[record.archiveId], {
        confidence: record.confidence,
        oddsPrice: record.oddsPrice,
        moneyline: record.moneyline,
        total: record.total,
        runLine: record.runLine
      });
    }
  });

  var merged = Object.keys(map).map(function(k) { return map[k]; });
  setTrackedPicks(merged);
  return added;
}

function applyConfidenceFilter() {
  var selected = document.getElementById("confidenceFilter").value;
  filteredGames = selected === "All"
    ? currentGames.slice()
    : currentGames.filter(function(g){ return (g.confidence || "Low") === selected; });

  renderCards(filteredGames);
  renderTable(filteredGames);
}
